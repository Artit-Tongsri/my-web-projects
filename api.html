<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card.done { 
            opacity: 0.5;
        }
        .status {
            font-size: 1.4rem;
        }
        .title { 
            flex: 1; 
            font-size: 0.95rem;
        }
        #loading {
            text-align: center;
            color: #888;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>รายการจาก API</h1>
        <div id="output">
            <p id="loading">กำโหลด...</p>
        </div>
    </div>

    <script>
        async function loadTodos() {
            const response = await fetch('https://jsonplaceholder.typicode.com/todos?_limit=10');
            const todos = await response.json();

            const output = document.querySelector('#output');
            output.innerHTML = '';

            todos.forEach(todo => {
                const card = document.createElement('div');
                card.className = 'card' + (todo.completed ? ' done' : '');

                card.innerHTML = `
                <span class="status">${todo.completed ? '✅' : '⬜️'}</span>
                <span class="title">${todo.title}</span>
                `;
                output.appendChild(card);
            })
        
        }
        loadTodos()
    </script>
</body>
</html>
